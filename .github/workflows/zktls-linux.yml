name: zkTLS on Linux
on:
  workflow_dispatch:
    inputs:
      mode:
        description: tee or split
        default: tee
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install agent dependencies
        run: npm ci --workspace @provia/agent --include-workspace-root=false --ignore-scripts
      - name: Prove a Paystack test transaction with zkTLS
        env:
          MODE: ${{ inputs.mode }}
          RECLAIM_ORG_TOKEN: ${{ secrets.RECLAIM_ORG_TOKEN }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
        run: node agent/scripts/zktls-check.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zktls-proof-${{ inputs.mode }}
          path: zktls-proof.json
          if-no-files-found: ignore
